# Extra server mounted into both containers as /etc/nginx/conf.d/compat.conf.
# The default server on port 80 (default.conf) is left untouched.
server {
    listen 8080;
    server_name localhost;
    root /srv/compat;

    gzip on;
    gzip_types text/plain application/json;
    gzip_min_length 20;

    location = /header {
        add_header X-Compat-Test "echo-nginx" always;
        return 200 "custom header\n";
    }

    location = /redirect {
        return 301 /static/hello.txt;
    }

    location = /json {
        default_type application/json;
        return 200 '{"ok":true}';
    }

    location /static/ {
    }

    location /large/ {
    }

    location /media/ {
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
    }
}
